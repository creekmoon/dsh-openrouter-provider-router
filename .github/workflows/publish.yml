name: publish

# 只在打 tag 或手动触发时发布；日常提交不碰 registry
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# OIDC 可信发布：拿 id-token 向 npm 换一次性发布票，仓库里不放任何 npm token
permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 可信发布要 npm 11.15 以上，node 22 自带的版本号更低
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Offline checks
        run: npm test

      # 版本号只能由 package.json 决定，tag 只负责触发；不一致直接失败，避免发错版本
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');const {version}=require('./package.json');if(tag!==version){console.error('tag v'+tag+' != package.json '+version);process.exit(1)}console.log('publishing '+version)"

      - name: Publish to npm via OIDC
        run: npm publish --provenance --access public
