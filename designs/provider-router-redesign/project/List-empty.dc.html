<div style="width:612px;height:380px;box-sizing:border-box;padding:24px;background:var(--paper);border-radius:28px;box-shadow:var(--panel-shadow);font-family:var(--sans);color:var(--ink1)">
  <div style="display:flex;flex-direction:column;gap:12px;max-width:720px">
    <h1 style="margin:0;font-size:16px;line-height:24px;font-weight:500">供应商路由器</h1>
    <p style="margin:0;font-size:14px;line-height:22px;color:var(--ink2)">OpenRouter 默认在同一模型的多个供应商之间自动挑选。这里每条指定都会把选择写死。</p>

    <div style="margin-top:12px;padding:12px;border:1px dashed var(--line3);border-radius:16px;text-align:center;font-size:13px;line-height:20px;color:var(--ink2)">
      还没有任何指定。没有指定时，OpenRouter 会自己挑，可能挑到更贵或更慢的那家。
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px">
      <span style="display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:18px;color:var(--ink3)">
        <span style="font-family:var(--code);font-variant-numeric:tabular-nums">1</span>选一个模型，或者选「所有 OpenRouter 模型」
      </span>
      <span style="display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:18px;color:var(--ink3)">
        <span style="font-family:var(--code);font-variant-numeric:tabular-nums">2</span>勾选要用的供应商，价格、上下文和可用性就在同一行
      </span>
      <span style="display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:18px;color:var(--ink3)">
        <span style="font-family:var(--code);font-variant-numeric:tabular-nums">3</span>保存后立即生效，不需要重启
      </span>
    </div>

    <button type="button" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin-top:8px;border:1px dashed var(--line3);border-radius:16px;background:transparent;font-family:var(--sans);font-size:14px;line-height:22px;color:var(--ink1);cursor:pointer">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 2v8M2 6h8"/></svg>
      新建指定
    </button>

    <div style="margin-top:24px;display:flex;align-items:center;gap:8px;min-width:0">
      <span style="flex:none;font-size:12px;line-height:18px;color:var(--ink3)">规则文件</span>
